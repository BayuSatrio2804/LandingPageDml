services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: dml
      POSTGRES_PASSWORD: dml_dev_only
      POSTGRES_DB: dml
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dml"]
      interval: 2s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
